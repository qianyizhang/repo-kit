name: MCP Apps
on:
  push:
    paths: ['plugins/repo-workbench/**', 'plugins/example-mcp-app/**', 'plugins/mcp-app-runtime/**', '.github/workflows/workbench.yml']
  pull_request:
    paths: ['plugins/repo-workbench/**', 'plugins/example-mcp-app/**', 'plugins/mcp-app-runtime/**', '.github/workflows/workbench.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        package: [repo-workbench, example-mcp-app]
    defaults:
      run:
        working-directory: plugins/${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            plugins/${{ matrix.package }}/package-lock.json
            plugins/mcp-app-runtime/package-lock.json
      - run: npm ci
        working-directory: plugins/mcp-app-runtime
      - run: npm run check
        working-directory: plugins/mcp-app-runtime
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chrome
      - run: npm run test:browser -- --max-failures=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: ${{ matrix.package }}-browser-failures
          path: plugins/${{ matrix.package }}/test-results
          retention-days: 14
