name: Copier template smoke
on:
  push:
    paths: ['copier.yml', 'template/**', 'tests/test_template_smoke.py', '.github/workflows/template-smoke.yml']
  pull_request:
    paths: ['copier.yml', 'template/**', 'tests/test_template_smoke.py', '.github/workflows/template-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  template-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.8
      - run: python -m unittest discover -s tests -p test_template_smoke.py -v
        env:
          REPO_KIT_COPIER_SMOKE: '1'
