# Governance kit — copier template.
# Deterministic file propagation for the portable governance layer (docs/rules/*,
# checks, ruff_base.toml, and the Claude discovery pointer) plus one-time
# repository bindings (AGENTS.md, docs/index.md, backlog, glossary, and configuration).
#
# Delivered paths outside _skip_if_exists are kit-owned. `copier update` merges
# template changes against the recorded baseline; review local edits/conflicts.
# Seeded paths (below) are written once and then repo-owned.
# Doctrine: docs/rules/governance.md "Kit propagation".

_subdirectory: template
_templates_suffix: .jinja
_envops:
  # Keep default Jinja delimiters; only *.jinja files are rendered, so real
  # scripts/toml ship verbatim and never collide with `{{ }}` in code.
  keep_trailing_newline: true

# Seeded once, then repo-owned — never clobbered on update.
_skip_if_exists:
  - AGENTS.md
  - docs/index.md
  - records/work-items/backlog.md
  - docs/glossary/ddd.md
  - pyproject-doc-governance.toml

_message_after_copy: |
  Governance kit applied.

  Next steps (see README.md for the full adoption
  procedure; replace <repo-python> with this repository's supported Python
  invocation):
    1. Merge `pyproject-doc-governance.toml` into your pyproject.toml
       ([tool.doc_governance] + [tool.ruff] extend), then delete that file.
    2. Keep specialized local skill copies in `.codex/skills/`, then run
       `<repo-python> scripts/bootstrap_agents.py` to create the symlink layout.
    3. Add frontmatter to authority docs and fill the repository bindings.
    4. `<repo-python> scripts/check_docs.py` until green; wire it into `make lint`.
    5. Review `[tool.authoring_check]`, then wire
       `<repo-python> scripts/check_authoring.py` into a separate advisory target.

_message_after_update: |
  Kit files updated. AGENTS.md owns repository policy; CLAUDE.md only points to it.
  For older baselines, reconcile both files using repo-kit's migration handoff.
  Review local bindings before accepting the result. Then
  replace <repo-python> with this repository's supported Python invocation and
  run `<repo-python> scripts/check_docs.py`; if the symlink map changed, also run
  `<repo-python> scripts/bootstrap_agents.py`.

project_name:
  type: str
  help: Human-readable project name (e.g. "drug-safety")

project_slug:
  type: str
  help: Python package / import name (snake_case)
  default: "{{ project_name | lower | replace('-', '_') | replace(' ', '_') }}"

project_tagline:
  type: str
  help: One line describing what this repo is

code_dirs:
  type: str
  help: >-
    Space-separated top-level dirs holding code/docs, used for check_docs path
    validation (repo_path_dirs). Include .codex if you ship skills.
  default: "src scripts tests docs .codex"
