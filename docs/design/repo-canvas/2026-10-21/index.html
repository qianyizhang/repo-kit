<header class="review-top"><div><div class="eyebrow">Design review · 21 October 2026 · Proposal</div><h1>Repo Canvas, one fact in one place.</h1><p>A reading-first architecture workspace. Explore each state, inspect the amber element notes, and leave comments against a specific behavior.</p></div><div class="review-actions"><button id="toggleNotes" class="on" aria-pressed="true">Element notes on</button><button id="commentShortcut">Comment on this state</button></div></header>
<nav class="review-nav" aria-label="Design review"><button data-page="prototype" class="on">Interactive layout</button><button data-page="contract">Information contract</button><button data-page="audit">Current UI audit</button><button data-page="comments">Your comments <span id="commentCount">0</span></button><span class="separator"></span><a href="design.md" style="align-self:center;font-size:12px;white-space:nowrap">Design specification</a></nav>
<main class="page"><div id="main"></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nodes=[{id:'authority',name:'Authority & decisions',kind:'Concept',purpose:'Root governance determines which evidence becomes shared behavior.',boundary:'Campaigns coordinate work and learning. They do not own policy, implementation or evidence.',notes:1,noteKind:'Decision',note:'Information may cross boundaries freely. Authority crosses only through an explicit decision by its owner.',sources:5},{id:'workbench',name:'Repo Workbench',kind:'Product',purpose:'Optional tools for architecture discussion, recorded-session review and local usage analysis.',boundary:'The plugin owns tool behavior. Target repositories own their architecture maps, case definitions and evidence.',delivery:'npm + plugin catalog',notes:1,noteKind:'Risk',note:'Package and protocol checks do not certify native desktop activation. Restart-dependent acceptance remains a separate check.',sources:4,children:4},{id:'candidates',name:'Candidate evidence',kind:'Concept',purpose:'Collect local friction, reviewed upstream ideas and downstream refinements for owner review.',boundary:'A copied idea or recent change does not acquire authority by itself.',sources:3},{id:'skills',name:'Shared agent skills',kind:'Product',purpose:'Reusable workflows for explanation, design, prioritization and scoped closeout.',boundary:'Shared skill text is installed once for the user; project-specific rules stay in each project.',delivery:'Standalone sync',sources:6,children:1},{id:'template',name:'Portable governance',kind:'Product',purpose:'Deliver shared doctrine, mechanical checks and agent bootstrap through Copier.',boundary:'Constitutions, vocabulary, indexes and local configuration are consumer-owned bindings.',delivery:'Copier',notes:1,noteKind:'Decision',note:'ADR-0006 supersedes shared-skill delivery through Copier. Consumer ownership and baseline reconciliation remain in force.',sources:4,children:2},{id:'consumers',name:'Project & user ownership',kind:'Boundary',purpose:'Keep repository meaning and evidence with the people and projects that own them.',boundary:'Installing a tool or shared skill does not transfer authority over project policy or data.',sources:4}];
const nodeBy=id=>nodes.find(n=>n.id===id)||nodes[1];
const notes={
identity:{id:'A1',name:'Repository context',purpose:'Identify the live repository once.',shows:'Short repository name; full canonical path and connection details only when opened.',behavior:'Open the repository menu without retargeting the map. An explicit selection wins over automatic resolution.',replaces:'Repeated repository title, path and breadcrumb copies in the header, navigation and scope heading.'},
save:{id:'A2',name:'Map persistence',purpose:'Make draft ownership and persistence unambiguous.',shows:'One map status and one Save map action. The current source file has its own separate save flow.',behavior:'Apply a proposal creates a draft. Save map persists that draft with a revision check.',replaces:'Global counts and reassurance text competing with meaningful unsaved/conflict status.'},
discussionEntry:{id:'A4',name:'Discussion entry',purpose:'Discuss the current map or selection.',shows:'One Discuss action opens the current-query panel.',behavior:'Preserve the composer when switching to details; context becomes a removable attachment.',replaces:'Separate side-chat, discuss-selection and repeated guidance entry points.'},typeEntry:{id:'A5',name:'Type management',purpose:'Find repository-defined concepts and their visual contracts.',shows:'One Types action opens the schema editor and previews.',behavior:'Definitions enter the map draft only after validation and explicit Apply.',replaces:'A fixed unexplained type dropdown in every inspector.'},mapActions:{id:'A6',name:'Secondary map actions',purpose:'Keep occasional document operations available without crowding the reading surface.',shows:'Add node, Undo, Export, Import and Reload in one disclosure.',behavior:'These affect map data or view state. File writes remain in the source workspace.',replaces:'Repeated toolbar buttons and mixed map/source actions.'},navigate:{id:'A3',name:'Scope navigation',purpose:'Move through architecture without permanently duplicating every card in a tree.',shows:'Browse, a scope breadcrumb only when nested, and direct context actions.',behavior:'Browse opens a temporary navigator. Entering a node changes scope; a single click pins its details.',replaces:'A permanently open tree listing the same nodes already visible on the canvas.'},
card:{id:'B1',name:'Node card',purpose:'Identify and orient at a glance.',shows:'Name, meaningful type and at most two intentionally chosen short fields. No chopped responsibility paragraph.',behavior:'Hover/focus previews new information. Click pins it. Child count is a navigation action, not repeated in the inspector.',replaces:'Name + truncated paragraph + full tooltip + repeated edit form visible together.'},
badge:{id:'B2',name:'Annotation entry point',purpose:'Make attached decisions, questions and risks immediately usable.',shows:'One typed badge per node; mixed annotations use a single total badge.',behavior:'Hover/focus previews note content. Click opens Notes directly. A pinned Notes panel suppresses the matching preview.',replaces:'A type/count at the top plus another note count at the bottom, neither revealing the note.'},
peek:{id:'B3',name:'Transient detail',purpose:'Explain the object while keeping the graph readable.',shows:'Fields not already on the card. No repeated node title or first-source path.',behavior:'Hover/focus after a short delay; moving into the peek keeps it open. Escape dismisses; Pin promotes the same content and removes the peek.',replaces:'A tooltip that repeats the card, overlaps an inspector, or disappears before its content is usable.'},
edge:{id:'C1',name:'Relationship target',purpose:'Explain direction and meaning directly on the graph.',shows:'A precise verb on focus/hover, with endpoints highlighted. Readable labels when space permits.',behavior:'Wide invisible hit area, keyboard focus, hover explanation. Click pins reading; Edit is a separate action.',replaces:'A click-to-read link that immediately opens a modal edit form.'},
edgePeek:{id:'C2',name:'Relationship explanation',purpose:'Reveal exactly what crosses the boundary and why.',shows:'Direction, relationship meaning, type and evidence action. Aggregated edges list their actual underlying relationships.',behavior:'Same persistent hover and pin behavior as nodes; touch taps pin. Reading never opens editable fields automatically.',replaces:'Hidden descriptions or an unlabeled generic dependency.'},
panel:{id:'D1',name:'Pinned reading surface',purpose:'Hold one object steady for deeper inspection.',shows:'Readable details first, with explicit Edit. The object name is repeated only if its card is offscreen or on a narrow layout.',behavior:'Clicking another object changes the pinned subject. Hover for the same subject is suppressed. Camera/zoom stays stable.',replaces:'A form that becomes the default reading experience and repeats every visible field.'},
panelTabs:{id:'D2',name:'Details, notes and sources',purpose:'Give different kinds of content one predictable home.',shows:'Three direct content choices. Sources are an action list; notes are readable annotations.',behavior:'A node badge opens Notes; a source reference opens Sources. No mandatory scrolling past unrelated editing forms.',replaces:'Sources, relationship creation and annotations concatenated into a long inspector.'},
edit:{id:'D3',name:'Explicit metadata editing',purpose:'Make intentional changes without confusing them with inspection.',shows:'Fields replace their corresponding read-only values. Apply updates the map draft; Cancel leaves it unchanged.',behavior:'Retain a local edit buffer. Validate before Apply. Switching subjects with unsaved edits requires keep/discard handling.',replaces:'Always-live textareas that obscure whether merely reading changed the map.'},
notes:{id:'E1',name:'Visible annotations',purpose:'Make the decision or risk available where it matters.',shows:'Type, author, concise content and provenance. Add/Edit controls are secondary.',behavior:'Open from a badge, pin to read, filter if many. Resolve/archive is explicit; never silently delete a decision.',replaces:'Important notes buried below sources and relationship creation.'},
history:{id:'F1',name:'Collapsed conversation history',purpose:'Keep prior context retrievable without making it dominate the view.',shows:'One closed history group with exchange count and meaningful question titles.',behavior:'Expand individually; leave current query and proposal visible. New replies do not force-scroll someone reading older content.',replaces:'The full raw initialization instruction and all previous messages before every current query.'},
current:{id:'F2',name:'Current exchange',purpose:'Focus on the question being answered now.',shows:'Current user query and latest response. Long initialization text gets an expandable human-readable title.',behavior:'Scope is frozen at send time. A later selection change does not relabel the response or its proposal.',replaces:'Repeated guidance, context explanations and old messages crowding out the active exchange.'},
proposal:{id:'F3',name:'Reviewable proposal',purpose:'Make a change understandable before applying it.',shows:'Short change summary, changed objects/fields and a Review action; raw JSON is advanced disclosure.',behavior:'Review → Apply to draft → Save map. A stale base blocks Apply and explains the needed refresh.',replaces:'Only whole-document counts and a JSON dump as the review experience.'},
composer:{id:'F4',name:'Stable composer and context',purpose:'Write the next query with explicit scope.',shows:'One removable selection attachment, draft-version context and a persistent input.',behavior:'Sending freezes scope, retains unsent text on delivery failure and never auto-retries uncertain delivery.',replaces:'Selection context repeated above the log, under the title and in the placeholder.'},
sourceRef:{id:'G1',name:'Bounded source reference',purpose:'Point to the evidence that supports a claim.',shows:'Meaningful label, file and exact one-based line range. Whole-file references still work.',behavior:'Open at the anchored block with optional surrounding context. Missing/out-of-range anchors are explicit, not silently clamped.',replaces:'Long paths truncated in the inspector that open an entire file from line 1.'},
sourceCode:{id:'G2',name:'Readable source',purpose:'Read repository text with enough context to evaluate the map.',shows:'Syntax highlighting, stable line numbers and the selected block. File identity and range appear once in the toolbar.',behavior:'Expand context or show the file; retain selection. Code text stays selectable and keyboard scrollable.',replaces:'An unhighlighted, unnumbered whole-file modal.'},
sourceEdit:{id:'G3',name:'Source edit buffer',purpose:'Edit the referenced block with a clearly bounded effect.',shows:'Editable block and a Review diff action. No second simultaneous copy of the same source.',behavior:'Edit is local until review. Warn before discarding unsaved edits. Source edits never piggyback on Save map.',replaces:'Ambiguous live editing that could modify a real file while changing map metadata.'},
sourceDiff:{id:'G4',name:'Diff and explicit file save',purpose:'Make a real-repository write concrete and reviewable.',shows:'Before/after content, exact target, changed lines and a Save file action.',behavior:'Bind revision, path, range and replacement. Reject stale revision or unsafe file identity; reload and review again. No force-save shortcut.',replaces:'Blind overwrite and a misleading shared save button.'},
type:{id:'H1',name:'Repository-owned type',purpose:'Give different concepts distinct, explainable fields and presentation.',shows:'Type name, semantic base and field definitions. Built-ins explain what their kinds mean.',behavior:'Repository types are declarative data. Agents can propose new definitions and affected nodes; users review before Apply.',replaces:'A fixed kind dropdown that changes a category label but not the information model.'},
typeFields:{id:'H2',name:'Field ownership',purpose:'Prevent duplication by construction.',shows:'Field name, value type and a single primary surface: Card, Peek or Details.',behavior:'Choose one primary home. Pinning promotes Peek fields; Details-only fields are added. Edit uses the same schema. No executable renderers.',replaces:'Independent ad hoc templates that allow the same field everywhere.'},
typePreview:{id:'H3',name:'Type preview and validation',purpose:'Show the actual result of a type change before applying it.',shows:'Card and detail projections with missing-value and compatibility checks.',behavior:'Changing field placement updates both previews. Schema proposals preserve existing values and show affected nodes.',replaces:'Guesswork about how a custom field will appear or whether an old client will drop it.'},
view:{id:'J1',name:'View controls',purpose:'Adjust the view without hiding important information.',shows:'Reading scale, Fit and selection focus in one control group.',behavior:'Preserve camera on panel open/resize; Fit is an explicit choice. Narrow screens switch to a readable flow/list and detail view.',replaces:'Automatic shrinking, repeated gesture hints and a second footer of global counts.'}
};
const steps=[
['overview','01','Orient','Identify the main concepts without reading six truncated paragraphs.'],
['peek','02','Peek','Hover adds purpose and boundary; the card already owns identity and delivery.'],
['pin','03','Pin & edit','Click promotes the detail. Editing deliberately replaces reading.'],
['relationship','04','Relationships','Understand the connection before opening any editing controls.'],
['notes','05','Notes','A visible risk badge leads directly to its contents.'],
['chat','06','Current query','Earlier exchanges fold away; scope and the current proposal stay clear.'],
['source','07','Read & edit source','Open a line block, inspect context, edit locally, review a diff, then save explicitly.'],
['types','08','Define types','Choose fields and their primary surfaces; inspect the projections before applying.']
];
let state={page:'prototype',step:'overview',panel:null,tab:'details',selected:'workbench',peek:null,peekKind:'node',editing:false,notes:true,sourceMode:'read',sourceContext:false,conflict:false,sourceSaved:false,query:'How does Workbench delivery differ from Copier?',sent:false,mapDirty:false,repoMenu:false,browse:false,zoom:100,typeFields:{delivery:'card',purpose:'peek',boundary:'details'},typeName:'Product',extraFields:[],addingField:false,commentElement:'',baseKind:'package',status:'Design simulation · no repository writes or model calls.'};
let stored=[];try{stored=JSON.parse(localStorage.getItem('repo-canvas-design-comments-v1')||'[]')}catch{}let comments=Array.isArray(stored)?stored:[];
let hoverTimer,hideTimer;
const sourceLines=["#!/usr/bin/env node","import {","  registeredRepositories,","  registerRepository,","  unregisterRepository,","  registryFile,","} from './repositories.ts';","import { canvasServer } from './canvas-server.ts';","import { setup } from './setup.ts';","import { createServer } from 'node:http';","import { resolve } from 'node:path';","import { runCli as usage } from '../usage/build.ts';","import { runCli as trace } from '../trace/build.ts';","import { asset } from './assets.ts';","import { apiMiddleware } from '../repo-canvas/src/server/api.ts';","import { Repository } from '../repo-canvas/src/server/repository.ts';","const [command, ...args] = process.argv.slice(2);","try {","  if (command === 'setup') console.log(JSON.stringify(await setup(args), null, 2));","  else if (command === 'usage') await usage(args);","  else if (command === 'trace') await trace(args);","  else if (command === 'repos') {","    const [action = 'list', path, ...extra] = args;","    if (action === 'list' && !path)"];
let sourceBaseline=sourceLines.slice(16,21).join('\n'), sourceDraft=sourceBaseline;
const attr=k=>`data-note="${k}"`;
const annotated=(k,html,cls='')=>`<div ${attr(k)} class="${cls}">${html}</div>`;
function highlight(s){return esc(s).replace(/(&#39;.*?&#39;|&quot;.*?&quot;)/g,'<span class="tok-str">$1</span>').replace(/\b(import|from|const|let|await|else|if|try)\b/g,'<span class="tok-key">$1</span>')}
function changedLine(i,kind){if(!kind)return '';const a=sourceBaseline.split('\n'),b=sourceDraft.split('\n');let first=0,last=0;while(first<Math.min(a.length,b.length)&&a[first]===b[first])first++;while(last<Math.min(a.length,b.length)-first&&a[a.length-1-last]===b[b.length-1-last])last++;return i>=first&&i<(kind==='diff-removed'?a.length:b.length)-last?kind:''}function code(lines,start=1,kind=''){return `<div class="code-view">${lines.map((s,i)=>`<div class="code-line ${i+start>=17&&i+start<=21?'target':''} ${changedLine(i,kind)}"><span class="line-num">${i+start}</span><span>${highlight(s)}</span></div>`).join('')}</div>`}
function setStep(step){state.step=step;state.panel=['pin','notes','chat'].includes(step)?(step==='chat'?'chat':'inspect'):null;state.selected='workbench';state.peek=step==='peek'?'workbench':step==='relationship'?'delivery':null;state.peekKind=step==='relationship'?'edge':'node';state.tab=step==='notes'?'notes':'details';state.editing=false;state.sourceMode='read';state.conflict=false;state.repoMenu=false;state.browse=false;state.status='Design simulation · no repository writes or model calls.';render()}
function header(){return `<div class="product-header"><span class="brand">Repo Canvas</span>${annotated('identity',`<button class="repo-switch" data-action="repo">repo-kit ▾</button>`)}<span class="header-spacer"></span>${annotated('save',`<div class="save-status"><small>${state.mapDirty?'Map draft changed':'Map saved'}</small><button ${!state.mapDirty?'disabled':''} class="${state.mapDirty?'primary':''}" data-action="save-map">Save map</button></div>`)}</div>${state.repoMenu?`<div class="context-menu"><strong>Current repository</strong><p style="margin-top:8px"><code>/Users/zhangqy/pkgs/repo-kit</code></p><small>In the product, this menu also contains connection details and repository switching.</small></div>`:''}`}
function toolbar(){return `<div class="product-toolbar">${annotated('navigate',`<button data-action="browse">Browse</button>`)}<span class="scope">${state.browse?'Choose a scope':'Architecture'}</span>${annotated('discussionEntry',`<button class="${state.panel==='chat'?'on':''}" data-action="chat">Discuss</button>`)}${annotated('typeEntry',`<button class="${state.step==='types'?'on':''}" data-action="types">Types</button>`)}${annotated('mapActions',`<button data-action="map-actions">Map actions</button>`)}</div>`}
function nodeCard(n){return `<div class="node ${state.panel&&state.selected===n.id?'active':''}" ${attr('card')} data-node="${n.id}"><button class="node-button" aria-label="Inspect ${esc(n.name)}" data-action="node" data-id="${n.id}"><span class="node-kind">${esc(n.kind)}</span><strong class="node-title">${esc(n.name)}</strong>${n.delivery?`<span class="node-meta">${esc(n.delivery)}</span>`:''}</button>${n.notes?`<span class="note-entry" ${attr('badge')}><button class="note-button" data-action="notes" data-id="${n.id}">${n.notes} ${n.noteKind.toLowerCase()}</button></span>`:''}${n.children?`<button class="node-enter" data-action="enter" data-id="${n.id}" aria-label="Enter ${esc(n.name)}">${n.children} inside →</button>`:''}</div>`}
function canvas(){return `<div class="canvas-pane"><div class="diagram"><div class="diagram-grid"><svg class="edges" viewBox="0 0 600 380" preserveAspectRatio="none" aria-label="Architecture relationships"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#91aa8e"/></marker></defs><path class="edge-line" d="M490 90 C450 15 150 15 110 90" marker-end="url(#arrow)"/><path class="edge-line" d="M100 130 L100 265" marker-end="url(#arrow)"/><path class="edge-line" d="M170 110 L245 110" marker-end="url(#arrow)"/><path class="edge-line" d="M170 120 C210 130 210 300 245 300" marker-end="url(#arrow)"/><g ${attr('edge')}><path tabindex="0" role="button" aria-label="Explain Workbench delivery" data-edge="delivery" data-action="edge" class="edge-hit" d="M355 115 C410 115 420 280 455 280"/><path class="edge-line" d="M355 115 C410 115 420 280 455 280" marker-end="url(#arrow)"/></g><path class="edge-line" d="M355 300 L455 300" marker-end="url(#arrow)"/></svg>${nodes.map(nodeCard).join('')}</div></div><div id="peekLayer">${peekMarkup()}</div>${annotated('view',`<div class="canvas-footer"><button data-action="zoom-out" aria-label="Zoom out">−</button><button data-action="zoom">${state.zoom}%</button><button data-action="zoom-in" aria-label="Zoom in">+</button><button data-action="fit">Fit</button><small>Hover to understand · click to pin</small></div>`)}</div>`}
function peekMarkup(){if(!state.peek)return '';const n=nodeBy(state.peek);if(state.panel==='inspect'&&state.selected===state.peek)return '';let content;if(state.peekKind==='edge')content=`<div class="peek-top"><small>Data flow</small><button class="quiet" data-action="close-peek" aria-label="Dismiss relationship preview">×</button></div><p><strong>Delivers optional tools</strong></p><small>Repo Workbench → project environment</small><p style="margin-top:10px">Prebuilt executable behavior is installed independently. Saved maps and authored evidence remain in the target repository.</p><div class="peek-actions"><button data-action="pin-edge">Pin relationship</button><button class="quiet" data-action="source">2 evidence blocks</button></div>`;else if(state.peekKind==='note')content=`<div class="peek-top"><small>${n.noteKind} · Codex</small><button class="quiet" data-action="close-peek" aria-label="Dismiss note preview">×</button></div><p>${esc(n.note)}</p><button data-action="notes" data-id="${n.id}">Pin note</button>`;else content=`<div class="peek-top"><small>Purpose</small><button class="quiet" data-action="close-peek" aria-label="Dismiss node preview">×</button></div><p>${esc(n.purpose)}</p><div class="peek-actions"><button data-action="node" data-id="${n.id}">Pin details</button><small>${n.kind==='Product'?'Independent delivery boundary':'Architecture concept'}</small></div>`;return `<div class="peek" tabindex="-1" role="region" aria-label="${state.peekKind==='edge'?'Relationship':state.peekKind==='note'?'Annotation':'Node'} preview" ${attr(state.peekKind==='edge'?'edgePeek':state.peekKind==='note'?'notes':'peek')}>${content}</div>`}
function inspectPanel(){let n=nodeBy(state.selected);return `<aside class="detail-panel">${annotated('panel',`<div class="panel-heading"><div><h2>${state.editing?'Edit node':state.selected==='delivery'?'Relationship':'Pinned object'}</h2><div class="selection-locator">${state.selected==='delivery'?'Workbench → project environment':esc(n.name)}</div></div><div class="actions">${!state.editing?'<button data-action="edit">Edit</button>':''}<button class="quiet close-button" data-action="close-panel" aria-label="Close details">×</button></div></div>`)}${!state.editing?annotated('panelTabs',`<div class="panel-tabs"><button data-action="tab" data-tab="details" class="${state.tab==='details'?'on':''}">Details</button><button data-action="tab" data-tab="notes" class="${state.tab==='notes'?'on':''}">Notes</button><button data-action="tab" data-tab="sources" class="${state.tab==='sources'?'on':''}">Sources · ${n.sources}</button></div>`):''}<div class="panel-content">${state.editing?annotated('edit',`<form id="metadataForm" class="edit-form"><label>Name<input name="name" value="${esc(n.name)}" required></label><label>Purpose<textarea name="purpose" rows="4">${esc(n.purpose)}</textarea></label><label>Boundary<textarea name="boundary" rows="4">${esc(n.boundary)}</textarea></label><div><button class="primary" type="submit">Apply to draft</button> <button type="button" data-action="cancel-edit">Cancel</button></div></form>`):state.tab==='notes'?annotated('notes',n.notes?`<article class="note-card"><div class="byline"><span>${n.noteKind}</span><span>Codex · 21 Oct</span></div><p>${esc(n.note)}</p><small>Source: migration acceptance record</small></article><button data-action="add-note">Add note</button>`:`<p>No annotations on this node.</p><button data-action="add-note">Add note</button>`):state.tab==='sources'?sourceReferences():state.selected==='delivery'?`<h3>Delivers optional tools</h3><p>Prebuilt executable behavior is installed independently. Saved maps and authored evidence function sourceReferences(){return annotated('sourceRef',`<button class="text-link" data-action="source"><strong>Command dispatch</strong><small>packages/runtime/cli.ts · L17–21</small></button><button class="text-link" data-action="source"><strong>Installation boundary</strong><small>README.md · delivery and ownership</small></button><p class="muted" style="font-size:11px;margin-top:14px">Demo opens one real, bounded source excerpt. Additional sources are design examples.</p>`)}
function chatPanel(){return `<aside class="detail-panel chat-layout"><div class="panel-heading"><h2>Discussion</h2><button class="quiet close-button" data-action="close-panel" aria-label="Close discussion">×</button></div>${annotated('history',`<details class="chat-history"><summary>2 earlier exchanges</summary><details class="history-item"><summary>Initialize the architecture map</summary><p>Requested a simplified, source-backed model. Codex proposed six overview concepts, nested features and typed flows.</p><details><summary>Show full request</summary><p>Read repository instructions, current code and bounded history; preserve ownership and source references; return a proposal before Apply and Save.</p></details></details><details class="history-item"><summary>Clarify delivery boundaries</summary><p>Shared skills, Copier governance and Workbench delivery have separate owners and update paths.</p></details></details>`)}<div class="chat-current">${annotated('current',`<div><div class="eyebrow" style="color:var(--muted)">Current query</div><p class="question">${esc(state.query)}</p><div class="chat-answer">${state.sent?'This is a local interaction demo. A real response would appear here after delivery through the owning chat.':'Workbench distributes executable tools through an optional npm/plugin installation. Copier distributes portable governance files and preserves local bindings. Neither delivery channel owns the project’s meaning or evidence.'}</div></div>`)}${!state.sent?annotated('proposal',`<div class="proposal-box"><strong>Make the ownership boundary explicit</strong><p>1 relationship label · 1 boundary field</p><button data-action="review-proposal">Review changes</button><div id="proposalReview" class="hidden"><p class="small-inset">Label: “npm/plugin install” → “Deliver optional tools”<br>Boundary: clarify that maps remain project-owned.</p><button class="primary" data-action="apply-proposal">Apply to draft</button></div></div>`):''}</div>${annotated('composer',`<form class="compose" id="chatForm"><div class="context-attachment"><span>Selection: ${esc(nodeBy(state.selected).name)}</span><button type="button" data-action="remove-context" aria-label="Remove selected context">×</button></div><label class="sr-only" for="query" style="margin-bottom:5px">Next query</label><textarea id="query" rows="3" placeholder="Ask about this architecture…" required></textarea><div class="compose-footer"><small>Current map draft included</small><button class="primary" type="submit">Send</button></div></form>`)}</aside>`}
function sourceWorkspace(){const mode=state.sourceMode;return `<div class="workspace-full">${annotated('sourceRef',`<div class="source-toolbar"><div class="file"><strong style="font-size:13px">Command dispatch</strong><div><code>plugins/repo-workbench/packages/runtime/cli.ts · L17–21</code></div></div><span class="tag">${state.sourceSaved?'Demo buffer saved':'Live working tree'}</span><button data-action="back-to-map">Back to map</button></div>`)}${mode==='read'?`${annotated('sourceCode',code(state.sourceContext?[...sourceLines.slice(0,16),...sourceBaseline.split('\n'),...sourceLines.slice(21)]:sourceBaseline.split('\n'),state.sourceContext?1:17))}<div class="source-bottom"><button data-action="source-context">${state.sourceContext?'Only referenced block':'Show surrounding context'}</button><button class="primary" data-action="source-edit">Edit block</button></div>`:mode==='edit'?`${annotated('sourceEdit',`<div><div class="source-toolbar"><small>Edit the referenced block. Other lines stay unchanged.</small><button data-action="demo-edit">Try a small edit</button></div><label for="sourceDraft" style="padding:12px 17px 0">Block content</label><textarea id="sourceDraft" class="source-editor" spellcheck="false">${esc(sourceDraft)}</textarea><div class="source-bottom"><button data-action="source-cancel">Cancel edit</button><button class="primary" data-action="source-review">Review diff</button></div></div>`)}`:`${annotated('sourceDiff',`<div><div class="diff-view"><div class="diff-column"><h3>Before · original file revision</h3>${code(sourceBaseline.split('\n'),17,'diff-removed')}</div><div class="diff-column"><h3>After · proposed replacement</h3>${code(sourceDraft.split('\n'),17,'diff-added')}</div></div>${state.conflict?`<div class="conflict" role="alert"><strong>The file changed since this edit began.</strong><br>Save is blocked. Reload the current file and review the change again.<div style="margin-top:10px"><button data-action="source-reload">Reload and review</button></div></div>`:''}<div class="source-bottom"><button data-action="source-edit">Back to edit</button><button data-action="source-conflict" ${state.conflict?'disabled':''}>Simulate external change</button><button class="primary" data-action="source-save" ${state.conflict||sourceDraft===sourceBaseline?'disabled':''}>Save file</button></div></div>`)}`}<div class="prototype-status"><strong>Prototype only.</strong> This editor changes an in-memory buffer. Production saves will validate the file revision, target path and block before writing.</div></div>`}
function typeWorkspace(){const fields=[['delivery','Delivery','text'],['purpose','Purpose','text'],['boundary','Boundary','text'],...state.extraFields.map(f=>[f.id,f.label,f.type])];const cardFields=fields.filter(([id])=>state.typeFields[id]==='card');const detailFields=fields.filter(([id])=>state.typeFields[id]!=='card');const values={delivery:'npm + plugin catalog',purpose:nodeBy('workbench').purpose,boundary:nodeBy('workbench').boundary,...Object.fromEntries(state.extraFields.map(f=>[f.id,f.value]))};const spec={id:'product',label:state.typeName,baseKind:state.baseKind,fields:fields.map(([id,label,type])=>({id,label,type,surface:state.typeFields[id]}))};return `<div class="workspace-full type-editor">${annotated('type',`<div class="type-summary"><label>Repository type<input id="typeName" value="${esc(state.typeName)}"></label><label>Semantic base<select id="baseKind">${[['package','independently delivered code'],['concept','domain meaning or rule'],['process','ordered work or transformation']].map(([value,label])=>`<option value="${value}" ${state.baseKind===value?'selected':''}>${value} — ${label}</option>`).join('')}</select></label><button data-action="back-to-map">Back to map</button></div>`)}${annotated('typeFields',`<table class="type-fields"><thead><tr><th>Field</th><th>Value type</th><th>Primary surface</th></tr></thead><tbody>${fields.map(([id,label,type])=>`<tr><td>${label}<br><small>${id}</small></td><td>${type}</td><td><select aria-label="${label} surface" data-field="${id}">${['card','peek','details'].map(v=>`<option ${state.typeFields[id]===v?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table><button style="margin-top:12px;font-size:12px" data-action="add-field">Add field</button>${state.addingField?`<form id="fieldForm" class="small-inset edit-form"><label>Field label<input name="label" required placeholder="Owner"></label><label>Value type<select name="type"><option>text</option><option>number</option><option>boolean</option><option>enum</option><option>source-reference</option></select></label><label>Example value<input name="value" required placeholder="Tooling team"></label><div><button type="submit">Add to definition</button> <button type="button" data-action="cancel-field">Cancel</button></div><small>New fields begin in Details. The production schema editor also defines enum options, defaults and requiredness.</small></form>`:''}`)}${annotated('typePreview',`<div class="type-preview"><div class="type-preview-box"><h3>Card projection</h3><span class="node-kind">${esc(state.typeName)}</span><strong>Repo Workbench</strong>${cardFields.map(([id,label])=>`<p><small>${label}</small><br>${esc(values[id])}</p>`).join('')}</div><div class="type-preview-box"><h3>Pinned details · promoted peek + detail fields</h3>${detailFields.map(([id,label])=>`<p><small>${label} · ${state.typeFields[id]}</small><br>${esc(values[id])}</p>`).join('')}</div></div><p class="inline-notice">${cardFields.length>2?'Card is too dense: use no more than two short fields.':cardFields.some(([id])=>String(values[id]).length>80)?'A card field is too long for quick reading. Prefer a short value or move it to Peek.':'No duplicate field placement. Card fields do not reappear in the detail projection.'}</p>`)}<details style="margin-top:16px"><summary style="font-size:12px">Inspect declarative definition</summary><pre class="schema">${esc(JSON.stringify(spec,null,2))}</pre></details><div class="source-bottom" style="padding:16px 0 0;margin-top:15px"><small>3 Product nodes affected · values preserved</small><button class="primary" data-action="apply-type" ${cardFields.length>2?'disabled':''}>Apply type to draft</button></div></div>`}
function product(){let content;if(state.step==='source')content=sourceWorkspace();else if(state.step==='types')content=typeWorkspace();else if(state.browse)content=`<div class="list-navigation"><h3>Choose a scope</h3>${nodes.map(n=>`<button data-action="node" data-id="${n.id}">${esc(n.name)}${n.children?' · '+n.children+' internals':''}</button>`).join('')}</div>`;else content=`<div class="workspace ${state.panel?'with-panel':''}">${canvas()}${state.panel==='chat'?chatPanel():state.panel==='inspect'?inspectPanel():''}</div>`;return `<div class="product">${header()}${toolbar()}${content}<div class="prototype-status" id="status" role="status">${esc(state.status)}</div></div>`}
function annotationCard(key,open=false){const n=notes[key];return `<details class="annotation-card" id="note-${key}" ${open?'open':''}><summary><span class="number">${n.id}</span><strong>${n.name}</strong></summary><dl><dt>Purpose</dt><dd>${n.purpose}</dd><dt>Visible content</dt><dd>${n.shows}</dd><dt>Expected behavior</dt><dd>${n.behavior}</dd><dt>Replaces / prevents</dt><dd>${n.replaces}</dd></dl><button class="quiet" style="margin-top:10px;font-size:11px" data-action="comment-element" data-key="${key}">Comment on ${n.id}</button></details>`}
function installAnnotations(){document.querySelectorAll('.note-marker').forEach(e=>e.remove());const items=[...document.querySelectorAll('[data-note]')];const keys=[...new Set(items.map(e=>e.dataset.note))];items.forEach(e=>{const key=e.dataset.note;if(e.namespaceURI.includes('svg'))return;e.classList.add('annotated');const marker=document.createElement('button');marker.className='note-marker';marker.type='button';marker.textContent=notes[key].id;marker.setAttribute('aria-label','Design note '+notes[key].id+': '+notes[key].name);marker.dataset.action='annotation';marker.dataset.key=key;e.append(marker)});const rail=document.getElementById('rail');if(rail)rail.innerHTML=`<h2>Element-by-element commentary</h2><p>Amber labels belong to this review page, not the product. Click one to inspect its contract.</p>${keys.map((key,i)=>annotationCard(key,i===0)).join('')}`;document.querySelector('.product')?.classList.toggle('review-hidden',!state.notes);document.querySelectorAll('.selection-locator').forEach(e=>{e.style.display=window.innerWidth<760||state.selected==='delivery'?'block':'none'})}
function prototypePage(){const [,num,title,desc]=steps.find(s=>s[0]===state.step);return `<div class="scenario-head"><div><h2><span class="step-label">${num}</span>${title}</h2><p>${desc}</p></div><select aria-label="Review scenario" id="scenario" style="width:185px;font-size:12px">${steps.map(([id,n,label])=>`<option value="${id}" ${id===state.step?'selected':''}>${n} · ${label}</option>`).join('')}</select></div><div class="walkthrough ${state.notes?'':'no-notes'}"><div><div class="review-note">Interactive proposal · browser-local simulation · existing map and repository files are untouched</div>${product()}<div class="review-footer"><small>${state.step==='peek'||state.step==='relationship'?'This scenario holds a hover state open for inspection. Real pointer/focus behavior also works on the cards and relationship.':'Use the real controls in the layout, or move through the eight review scenarios.'}</small><div><button data-action="previous">Previous</button> <button data-action="next">Next</button></div></div></div>${state.notes?'<aside class="annotation-rail" id="rail"></aside>':''}</div>`}
function contractPage(){const rows=[['Repository & scope','Repository selector; nested breadcrumb only when needed','Canonical path and connection status behind the selector','No duplicate root heading or persistent mirrored tree'],['Node identity','Card','Compact locator only when card is offscreen','Hover and desktop inspector do not repeat its name'],['Purpose / responsibility','Peek → pinned details','The same field moves when pinned','No card paragraph and no live edit textarea until Edit'],['Short domain fields','Type-selected Card fields','Moved by explicit type-definition change','Never automatically repeated in Details'],['Relationship meaning','Edge peek → pinned relationship','Exact underlying edges if aggregated','Click reads; editing requires Edit'],['Annotation','Badge → note preview / Notes','Type and author qualify the note','One badge; no second footer count'],['Conversation context','Frozen request context / one composer attachment','History remains expandable','Changing selection cannot relabel a past response'],['Proposed change','Review panel','Field-level changes; raw data in advanced disclosure','Apply changes draft; Save persists'],['Source evidence','Named file/range reference → source workspace','Surrounding context on demand','No wall of whole-file paths and no duplicated code/editor'],['Source write','Reviewed diff + Save file','Exact target, baseline revision and stale state','Independent from Save map'],['Type schema','Repository type definition editor','Primary field placement and preview','No arbitrary executable renderers']];return `<article class="doc-page"><div class="eyebrow">Information architecture</div><h2>Every fact has a visible owner.</h2><p>The key is not simply removing text. Each action has a single job: orient, explain, hold, edit or persist. When the state changes, information moves to the new owner.</p><div class="transition-strip"><span>Card: identify</span>→<span>Peek: understand</span>→<span>Pin: examine</span>→<span>Edit: change</span>→<span>Review: decide</span></div><div class="contract-wrap"><table class="contract-table"><thead><tr><th>Information</th><th>Primary home</th><th>Disclosure</th><th>Duplication rule</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="doc-grid"><section class="doc-card"><h3>Two kinds of save</h3><p><strong>Map:</strong> proposal → review → Apply to draft → Save map.</p><p><strong>Source:</strong> edit block → Review diff → Save file.</p><p>Saving source may make an architecture claim stale. Keep the map unsaved status independent and invite a source recheck rather than silently updating the map.</p></section><section class="doc-card"><h3>One interaction contract</h3><ul><li>Hover and keyboard focus expose the same explanation.</li><li>Click or touch pins; Escape dismisses previews.</li><li>Peek stays open while hovered or focused.</li><li>Selected subject suppresses its matching peek.</li><li>Edits replace the read view and have a cancel path.</li></ul></section><section class="doc-card"><h3>Types are data, not executable plugins</h3><p>A repository type declares its semantic base, fields and primary surfaces. The agent proposes the definition together with its affected nodes.</p><p>Unknown definitions retain values and use a visible fallback. Versioned parsing must reject unsupported changes instead of silently dropping fields.</p></section><section class="doc-card"><h3>Small screens retain meaning</h3><p>Do not shrink the entire map to fit an open inspector. Preserve the viewport; offer a readable list/flow with a dedicated details or source surface.</p><p>The prototype puts pinned details first at narrow widths, with the readable map below. A production camera/gesture implementation still needs native browser verification.</p></section><section class="doc-card"><h3>What is allowed to repeat?</h3><p>An identity may reappear as a locator only when the original object is out of view, or when it identifies an endpoint in a distinct relationship. Accessible names remain complete even if visually concise.</p><p>Field values, note counts and full descriptions do not appear twice in one active reading state.</p></section><section class="doc-card"><h3>What this prototype does not certify</h3><p>No repository writes, model calls, host delivery, schema migrations or executable node extensions. Conflict and delivery states are simulations.</p><p>The live pass needs API tests for source containment/concurrency, schema round trips, keyboard journeys and hosted Apply/Save behavior.</p></section></div></article>`}
function auditPage(){return `<article class="doc-page"><div class="eyebrow">Evidence-backed audit</div><h2>The current UI defaults to editing when the user is trying to understand.</h2><p>Captured from the local Repo Canvas runtime at desktop and narrow widths. Your supplied screenshot adds the clearest example of three simultaneous copies of the same description.</p><div class="doc-grid"><section class="doc-card"><h3>1 · Node inspection — needs redesign</h3><p>Identity and responsibility appear on the card, in the hover card and in form fields. Sources and relationship-creation controls push annotations below the first screen.</p><p><strong>Response:</strong> compact identity cards; a single peek-to-pinned detail surface; explicit Edit and direct Notes access.</p></section><section class="doc-card"><h3>2 · Relationship reading — needs redesign</h3><p>“Explain relationship” opens a modal containing selectors, textareas, Remove and Save. A reading action becomes an editing workflow.</p><p><strong>Response:</strong> hover/focus explains; click pins a read view; Edit deliberately changes the mode.</p></section><section class="doc-card"><h3>3 · Source reading — incomplete</h3><p>The modal begins at file line 1, with plain monospaced text and no line gutter. A single evidence reference therefore asks the reader to find the relevant code.</p><p><strong>Response:</strong> anchored ranges, syntax coloring, line numbers, context expansion and a separately reviewed file write.</p></section><section class="doc-card"><h3>4 · Chat & types — source-backed limits</h3><p>SideChat.tsx renders all messages inline. The current fixed module-kind enum does not define custom fields or separate projections.</p><p>The standalone preview cannot reproduce historical hosted exchanges. Chat folding and type editing here are proposed behavior, not observed acceptance.</p></section></div><div class="evidence"><details><summary>Screenshot 1 · Desktop node inspector</summary><p>The note begins at the bottom edge after source and relationship forms. Card content is repeated in inspector editing fields.</p><img src="evidence/02-desktop-before.png" alt="Existing desktop Repo Canvas inspector showing repeated responsibility and notes below the fold"></details><details><summary>Screenshot 2 · Relationship edit dialog</summary><p>The default explanation action opens an editable modal; readable content and destructive controls share one surface.</p><img src="evidence/04-relationship-before.png" alt="Existing relationship dialog with edit fields and remove/save actions"></details><details><summary>Screenshot 3 · Whole-file source preview</summary><p>Plain code, no visible line numbers or selected evidence block.</p><img src="evidence/03-source-before.png" alt="Existing plain source preview showing the whole CLI file"></details><details><summary>Screenshot 4 · Narrow inspector</summary><p>The map becomes an overview while the form occupies most of the reading area. The prototype replaces automatic shrinking with an explicit compact layout.</p><img src="evidence/01-inspector-before.png" alt="Existing narrow Repo Canvas with a small graph and large inspector form"></details></div><div class="doc-card"><h3>Accessibility and evidence limits</h3><p>The captures show density and disclosure problems. They do not certify contrast, screen-reader behavior or complete keyboard compliance. The proposed implementation must test focus transfer, hover persistence, Escape, touch equivalents, no hidden destructive controls, and readable code at narrow widths.</p><p>Relevant owners: Canvas.tsx, Inspector.tsx, RelationshipDialog.tsx, SideChat.tsx, model/document.ts, model/contracts.ts and server/repository.ts. The existing Little Clarity palette and typography are retained.</p></div></article>`}

mport · Reload. These existing actions remain secondary; no duplicate save or source-write command.')}else if(a==='save-map'){state.mapDirty=false;render();status('Demo map draft saved in memory. No repository file was written.')}else if(a==='review-proposal'){document.getElementById('proposalReview').classList.toggle('hidden')}else if(a==='apply-proposal'){state.mapDirty=true;render();status('Demo proposal applied to the map draft. Save map remains separate.')}else if(a==='remove-context'){el.closest('.context-attachment').remove();status('Selection attachment removed for the next query. Existing exchanges keep their frozen context.')}else if(a==='add-note'){comment('notes')}else if(a==='source-context'){state.sourceContext=!state.sourceContext;render()}else if(a==='source-edit'){state.sourceMode='edit';render()}else if(a==='demo-edit'){sourceDraft=sourceBaseline.replace("const [command, ...args] = process.argv.slice(2);","const [command = '--help', ...args] = process.argv.slice(2);");document.getElementById('sourceDraft').value=sourceDraft;status('Example-only edit. Review the exact replacement before the simulated save.')}else if(a==='source-review'){sourceDraft=document.getElementById('sourceDraft').value;if(sourceDraft===sourceBaseline){status('No changes to review. Edit the block or try the small example edit.');return}state.sourceMode='diff';render()}else if(a==='source-cancel'){sourceDraft=sourceBaseline;state.sourceMode='read';render()}else if(a==='source-conflict'){state.conflict=true;render()}else if(a==='source-reload'){state.conflict=false;sourceBaseline=sourceBaseline.replace('try {','try { // external update');render();status('External change loaded into the baseline. Review the combined diff again before saving.')}else if(a==='source-save'){if(state.conflict)return;sourceBaseline=sourceDraft;state.sourceSaved=true;state.sourceMode='read';render();status('Simulated file save complete. No repository write occurred; the map state is independent.')}else nodeCard=function(n){const children=childrenOf(n.id),list=notesFor('node',n.id);const sev=list.length===1?list[0].severity:'info';return `<div class="node ${state.panel&&state.selected===n.id?'active':''} ${!inGroup(n)?state.filterMode==='hide'?'masked-node':'dimmed-node':''}" ${attr('card')} data-node="${n.id}" data-context-kind="node" data-context-id="${n.id}" ${!inGroup(n)&&state.filterMode==='hide'?'inert':''}><button class="node-button" aria-label="Inspect ${esc(n.name)}" data-action="node" data-id="${n.id}"><span class="node-kind">${esc(n.kind)}</span><strong class="node-title">${esc(n.name)}</strong>${n.delivery?`<span class="node-meta">${esc(n.delivery)}</span>`:''}</button><button class="object-menu" data-action="v2-menu" data-kind="node" data-id="${n.id}" aria-label="Actions for ${esc(n.name)}">···</button>${list.length?`<span class="note-entry severity-${sev}" ${attr('badge')}><button class="note-button severity-${sev}" data-action="notes" data-id="${n.id}">${list.length} ${list.length===1?sev:'notes'}</button></span>`:''}<span class="child-entry" ${attr('child')}><button class="node-enter" data-action="${children.length?'v2-scope':'v2-child'}" data-id="${n.id}" aria-label="${children.length?'Enter':'Add child to'} ${esc(n.name)}">${children.length?children.length+' inside →':'+'}</button></span></div>`};
canvas=function(){const visible=scopeNodes();const filtered=state.activeGroup!=='all';const related=state.activeGroup==='all'||activeGroup()?.members.includes('workbench')&&activeGroup()?.members.includes('consumers');return `<div class="canvas-pane" tabindex="0" aria-label="Architecture canvas" data-context-kind="canvas" data-context-id="${state.scope}">${v2GroupStrip()}<div class="diagram"><div class="diagram-grid ${visible.length<4?'few-nodes':''}">${state.scope==='repo'?`<svg class="edges ${filtered?'filtered-edges':''}" viewBox="0 0 600 380" preserveAspectRatio="none" aria-label="Architecture relationships"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#91aa8e"/></marker></defs><path class="edge-line background-edge" d="M490 90 C450 15 150 15 110 90" marker-end="url(#arrow)"/><path class="edge-line background-edge" d="M100 130 L100 265" marker-end="url(#arrow)"/><path class="edge-line background-edge" d="M170 110 L245 110" marker-end="url(#arrow)"/><g ${attr('edge')} class="${!related?(state.filterMode==='hide'?'masked-edge':'dimmed-edge'):''}"><path tabindex="0" role="button" aria-label="Explain Workbench delivery" data-edge="delivery" data-context-kind="relationship" data-context-id="${edge.id}" data-action="edge" class="edge-hit" d="M355 115 C410 115 420 280 455 280"/><path class="edge-line" d="M355 115 C410 115 420 280 455 280" marker-end="url(#arrow)"/></g><path class="edge-line background-edge" d="M355 300 L455 300" marker-end="url(#arrow)"/></svg>`:''}${visible.map(nodeCard).join('')}${!visible.length?`<div class="empty-scope"><p>No child nodes yet.</p><button data-action="v2-child" data-id="${state.scope}">Add first child</button></div>`:''}</div></div><div id="peekLayer">${peekMarkup()}</div>${annotated('view',`<div class="canvas-footer"><button data-action="zoom-out" aria-label="Zoom out">−</button><button data-action="zoom">${state.zoom}%</button><button data-action="zoom-in" aria-label="Zoom in">+</button><button data-action="fit">Fit</button><small>Right-click for actions</small><button class="quiet" data-action="v2-menu" data-kind="canvas" data-id="${state.scope}" aria-label="Canvas context menu">···</button></div>`)}</div>`};
function v2NoteCard(n){return `<article class="note-card severity-${n.severity}" tabindex="0" data-context-kind="note" data-context-id="${n.id}"><div class="byline"><span>${n.severity}${n.intent?' · '+esc(n.intent):''}</span><span>${esc(n.author)}</span></div><p>${esc(n.text)}</p>${n.source?`<small>${esc(n.source)}</small>`:''}<div class="note-actions"><button data-action="v2-edit-note" data-id="${n.id}">Edit</button><button data-action="v2-remove-note" data-id="${n.id}">Remove</button><button class="quiet" data-action="v2-menu" data-kind="note" data-id="${n.id}" aria-label="Actions for ${esc(n.severity)} note">···</button></div></article>`}
const oldInspector=inspectPanel;
inspectPanel=function(){if(state.tab!=='notes')return oldInspector();const target=currentNoteTarget(),n=nodeBy(state.selected),list=notesFor(target.kind,target.id);return `<aside class="detail-panel">${annotated('panel',`<div class="panel-heading"><div><h2>Pinned object</h2><div class="selection-locator">${state.selected==='delivery'?'Workbench delivery':esc(n.name)}</div></div><button class="quiet close-button" data-action="close-panel" aria-label="Close details">×</button></div>`)}${annotated('panelTabs',`<div class="panel-tabs"><button data-action="tab" data-tab="details">Details</button><button class="on" data-action="tab" data-tab="notes">Notes</button><button data-action="tab" data-tab="sources">Sources</button></div>`)}<div class="panel-content">${annotated('notes',`${list.map(v2NoteCard).join('')||'<p class="muted">No saved notes on this object.</p>'}<button data-action="v2-add-note" data-kind="${target.kind}" data-id="${target.id}">Add note</button>${state.undoNote?'<div class="undo-note" role="status">Note removed. <button data-action="v2-undo-note">Undo</button></div>':''}`)}</div></aside>`};
const oldPeek=peekMarkup;
peekMarkup=function(){if(state.peekKind!=='note')return oldPeek();const list=notesFor('node',state.peek);if(!list.length)return '';if(state.panel==='inspect'&&state.selected===state.peek)return '';const n=list[0];return `<div class="peek severity-${n.severity}" tabindex="0" role="region" aria-label="Annotation preview" ${attr('notes')} data-context-kind="note" data-context-id="${n.id}"><div class="peek-top"><small>${n.severity}${n.intent?' · '+esc(n.intent):''} · ${n.author}</small><button class="quiet" data-action="close-peek" aria-label="Dismiss note preview">×</button></div><p>${esc(n.text)}</p><button data-action="notes" data-id="${state.peek}">Pin notes</button><button class="quiet" data-action="v2-menu" data-kind="note" data-id="${n.id}" aria-label="Note actions">···</button></div>`};
const oldChat=chatPanel;
chatPanel=function(){if(!state.feedbackQueue.length&&state.step!=='feedback')return oldChat();return `<aside class="detail-panel feedback-panel"><div class="panel-heading"><h2>Agent comments</h2><button class="quiet close-button" data-action="close-panel" aria-label="Close discussion">×</button></div><div class="panel-content">${annotated('handoff',`<p class="muted">${state.feedbackQueue.length?'Context is frozen for each comment.':'Right-click a node, link or note to capture its context.'}</p>${state.feedbackQueue.map((f,i)=>`<article class="feedback-card"><small>${esc(f.context.target.kind)} · ${esc(f.context.target.label)}</small><p>${esc(f.instruction)}</p><details><summary>Captured context</summary><pre>${esc(JSON.stringify(f.context,null,2))}</pre></details><button class="quiet" data-action="v2-remove-feedback" data-index="${i}">Remove from queue</button></article>`).join('')}<button class="primary" data-action="v2-handoff" ${!state.feedbackQueue.length?'disabled':''}>Review handoff</button><p class="inline-notice">Local prototype: copy the reviewed request into the main chat. Nothing is sent automatically.</p>`)}</div></aside>`};
const oldProduct=product;
product=function(){let content;if(state.step==='source')content=sourceWorkspace();else if(state.step==='types')content=typeWorkspace();else content=`<div class="workbench-shell ${state.navOpen?'has-nav':''}">${state.navOpen?v2Navigation():''}<div class="workspace ${state.panel?'with-panel':''}">${canvas()}${state.panel==='chat'?chatPanel():state.panel==='inspect'?inspectPanel():''}</div></div>`;return `<div class="product">${header()}${toolbar()}${content}<div class="prototype-status" id="status" role="status">${esc(state.status)}</div></div>`};
function v2MenuMarkup(){const m=state.menu;if(!m)return '';const t=m.target;let actions=[];if(['node','relationship','note'].includes(t.kind))actions.push(['v2-comment-target','Comment to agent…']);if(t.kind==='node')actions.push(['v2-note-target','Add map note…'],['v2-child-target','Add child…'],['v2-edit-target','Edit node']);if(t.kind==='relationship')actions.push(['v2-note-target','Add map note…'],['v2-pin-target','Pin relationship']);if(t.kind==='note')actions.push(['v2-note-edit-target','Edit note…'],['v2-note-remove-target','Remove note']);if(t.kind==='group')actions.push(['v2-edit-group-target','Edit group…'],['v2-remove-group-target','Remove group']);if(t.kind==='canvas')actions.push(['v2-child-target','Add node…'],['v2-new-group-target','Create group / lane…'],['v2-undo-target','Undo last note removal'],['v2-export-target','Export map draft'],['v2-import-target','Import map draft…'],['v2-reload-target','Reload prototype draft']);return `<div class="object-context-menu" role="menu" aria-label="Actions for ${esc(t.label)}" style="left:${Math.min(m.x,innerWidth-255)}px;top:${Math.max(8,Math.min(m.y,innerHeight-360))}px" ${attr('mapActions')}><div class="menu-target">${esc(t.kind)} · ${esc(t.label)}</div>${actions.map(([action,label])=>`<button role="menuitem" data-action="${action}" ${action==='v2-undo-target'&&!state.undoNote?'disabled':''}>${label}</button>`).join('')}</div>`}
function v2ModalMarkup(){const m=state.modal;if(!m)return '';let content='';let key='contextualComment';if(m.type==='comment'){content=`<h2>Comment to agent</h2><p class="target-chip">${esc(m.target.kind)} · ${esc(m.target.label)}</p><form id="v2CommentForm"><label>Instruction<textarea name="instruction" rows="5" autofocus required placeholder="What should change, and why?"></textarea></label><details class="captured-context"><summary>Captured object, sources and map revision</summary><pre>${esc(JSON.stringify(m.context,null,2))}</pre></details><footer><button type="button" data-action="v2-close-modal">Cancel</button><button class="primary" type="submit">Queue for main chat</button></footer></form><small>This creates a request attachment, not a permanent map note.</small>`}else if(m.type==='note'){key='notes';const n=m.note;content=`<h2>${n?'Edit note':'Add map note'}</h2><p class="target-chip">${esc(m.target.label)}</p><form id="v2NoteForm"><label>Preset<select name="severity"><option value="risk" ${n?.severity==='risk'?'selected':''}>Risk · red</option><option value="warning" ${n?.severity==='warning'?'selected':''}>Warning · yellow</option><option value="info" ${!n||n?.severity==='info'?'selected':''}>Info · white</option></select></label><label>Note<textarea name="text" rows="5" required>${esc(n?.text||'')}</textarea></label>${n?.intent?`<small>Preserved intent: ${esc(n.intent)}</small>`:''}<footer><button type="button" data-action="v2-close-modal">Cancel</button><button class="primary" type="submit">Apply note to draft</button></footer></form><small>Removal can be undone. Color is paired with a label.</small>`}else if(m.type==='child'){key='child';content=`<h2>${m.parent==='repo'?'Add node':'Add child node'}</h2><p class="target-chip">Parent: ${m.parent==='repo'?'Architecture':esc(nodeBy(m.parent).name)}</p><form id="v2ChildForm"><label>Name<input name="name" required autofocus placeholder="New responsibility"></label><label>Purpose<textarea name="purpose" rows="3" placeholder="What does this node own?"></textarea></label><footer><button type="button" data-action="v2-close-modal">Cancel</button><button class="primary" type="submit">Create in draft</button></footer></form><small>The parent keeps its identity and position. Its child count and navigation entry update.</small>`}else if(m.type==='group'){key='groupDefinition';const g=m.group;content=`<h2>${g?'Edit group':'Create group / lane'}</h2><form id="v2GroupForm"><label>Name<input name="name" required value="${esc(g?.name||'')}" placeholder="Delivery"></label><label>Short description<textarea name="description" rows="2">${esc(g?.description||'')}</textarea></label><label>Presentation<select name="presentation"><option value="group" ${g?.presentation!=='lane'?'selected':''}>Group · focus collection</option><option value="lane" ${g?.presentation==='lane'?'selected':''}>Lane · labeled member strip</option></select></label><fieldset><legend>Existing nodes in this scope</legend>${scopeNodes().map(n=>`<label class="member-choice"><input type="checkbox" name="members" value="${n.id}" ${g?.members.includes(n.id)?'checked':''}>${esc(n.name)}</label>`).join('')}</fieldset><footer><button type="button" data-action="v2-close-modal">Cancel</button><button class="primary" type="submit">Apply group to draft</button></footer></form><small>Membership is a reference. It never reparents or copies a node.</small>`}else if(m.type==='handoff'){key='handoff';content=`<h2>Review main-chat request</h2><p>${state.feedbackQueue.length} anchored ${state.feedbackQueue.length===1?'instruction':'instructions'} · context captured when authored</p><pre class="handoff-text">${esc(v2RequestText())}</pre><footer><button data-action="v2-close-modal">Back</button><button data-action="v2-export-request">Export request</button><button class="primary" data-action="v2-copy-request">Copy request</button></footer><p class="inline-notice" id="handoffStatus">Copy and paste into the main chat. This prototype has no host-send connection.</p>`}else if(m.type==='import'){key='mapActions';content='<h2>Import draft</h2><p>The production action accepts a versioned map document, previews its changes and replaces only the draft after review.</p><p class="muted">This design prototype does not import repository data.</p><button data-action="v2-close-modal">Close</button>'}return `<div class="prototype-modal-overlay"><section class="prototype-dialog" role="dialog" aria-modal="true" aria-label="${esc(m.type==='comment'?'Comment to agent':m.type==='note'?'Edit map note':m.type==='group'?'Group definition':m.type==='handoff'?'Agent handoff':'Draft action')}" ${attr(key)}><button class="dialog-close quiet" data-action="v2-close-modal" aria-label="Close dialog">×</button>${content}${state.notes?`<details class="modal-design-note"><summary>Design intent · ${notes[key].id}</summary><p>${notes[key].purpose}</p><p>${notes[key].behavior}</p><small>Review annotation, not part of the product dialog.</small></details>`:''}</section></div>`}
function v2RequestText(){return 'Please review these Repo Canvas comments and propose changes. Preserve unrelated map content. Return a reviewed proposal; do not apply or save automatically.\n\n'+state.feedbackQueue.map((f,i)=>`${i+1}. ${f.instruction}\n\nCaptured context:\n${JSON.stringify(f.context,null,2)}`).join('\n\n')}
const oldRender=render;
render=function(){oldRender();document.querySelectorAll('.v2-overlay-host').forEach(e=>e.remove());const host=document.createElement('div');host.className='v2-overlay-host';host.innerHTML=v2MenuMarkup()+v2ModalMarkup();document.body.append(host);if(state.step==='feedback'&&!state.panel){state.panel='chat';return render()}if(state.page==='prototype'&&state.activeGroup!=='all'&&activeGroup()?.presentation==='lane'){document.querySelector('.diagram')?.insertAdjacentHTML('afterbegin',`<div class="lane-label">${esc(activeGroup().name)}<small>${activeGroup().members.length} member references · hierarchy unchanged</small></div>`)}document.querySelectorAll('.review-footer small').forEach(e=>{e.textContent=e.textContent.replace('eight review scenarios','eleven review scenarios')})};
let menuFocus=null,menuReturnTarget=null;
function v2OpenMenu(kind,id,x,y){menuFocus=document.activeElement;menuReturnTarget={kind,id};state.menu={target:v2Target(kind,id),x:Math.max(8,x),y:Math.max(8,y)};state.peek=null;clearTimeout(hoverTimer);clearTimeout(hideTimer);render();document.querySelector('.object-context-menu button:not(:disabled)')?.focus()}
function v2OpenModal(m){state.menu=null;state.modal=m;state.peek=null;render();(document.querySelector('.prototype-dialog input,.prototype-dialog textarea,.prototype-dialog select')||document.querySelector('.prototype-dialog button'))?.focus()}
function v2Close(){state.menu=null;state.modal=null;render();if(menuFocus?.isConnected)menuFocus.focus();else{const t=menuReturnTarget;const owner=t?.kind==='node'?[...document.querySelectorAll('[data-node]')].find(n=>n.dataset.node===t.id)?.querySelector('.node-button'):t?.kind==='note'?[...document.querySelectorAll('.note-card')].find(n=>n.dataset.contextId===t.id):t?.kind==='relationship'?document.querySelector('[data-edge]'):null;(owner||document.querySelector('.canvas-pane'))?.focus()}}
function v2RemoveNote(id){const index=mapNotes.findIndex(n=>n.id===id);if(index<0)return;state.undoNote={index,note:mapNotes[index]};mapNotes.splice(index,1);state.mapDirty=true;state.menu=null;syncNotes();render();status('Note removed from the demo draft. Undo is available in Notes or the canvas context menu.')}
function v2AddNote(target){v2OpenModal({type:'note',target,note:null})}
function v2EditNote(id){const n=mapNotes.find(n=>n.id===id);if(n)v2OpenModal({type:'note',target:v2Target(n.targetKind,n.targetId),note:{...n}})}
function v2Download(text,name,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('contextmenu',e=>{if(!e.target.closest('.product'))return;const note=e.target.closest('[data-context-kind="note"]'),link=e.target.closest('[data-context-kind="relationship"]'),node=e.target.closest('[data-context-kind="node"]'),group=e.target.closest('[data-group-id]'),blank=e.target.closest('.canvas-pane');const t=note||link||node||blank;if(!t&&!group)return;e.preventDefault();e.stopImmediatePropagation();if(group)v2OpenMenu('group',group.dataset.groupId,e.clientX,e.clientY);else v2OpenMenu(t.dataset.contextKind,t.dataset.contextId,e.clientX,e.clientY)},true);
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(!a.startsWith('v2-')){if(state.menu){state.menu=null;document.querySelector('.object-context-menu')?.remove()}return}e.preventDefault();e.stopImmediatePropagation();const t=state.menu?.target;if(a==='v2-nav'){state.navOpen=!state.navOpen;render()}else if(a==='v2-root'||a==='v2-scope'){state.scope=a==='v2-root'?'repo':el.dataset.id;state.activeGroup='all';state.panel=null;state.peek=null;state.menu=null;render()}else if(a==='v2-menu'){const r=el.getBoundingClientRect();v2OpenMenu(el.dataset.kind,el.dataset.id,r.left,r.bottom+5)}else if(a==='v2-child'||a==='v2-child-target'){v2OpenModal({type:'child',parent:a==='v2-child'?el.dataset.id:t.kind==='canvas'?state.scope:t.id})}else if(a==='v2-group'){state.activeGroup=el.dataset.id;state.peek=null;render()}else if(a==='v2-create-group'||a==='v2-new-group-target'){v2OpenModal({type:'group',group:null})}else if(a==='v2-edit-group'||a==='v2-edit-group-target'){v2OpenModal({type:'group',group:groups.find(g=>g.id===(a==='v2-edit-group'?state.activeGroup:t.id))})}else if(a==='v2-remove-group-target'){const i=groups.findIndex(g=>g.id===t.id);if(i>=0)groups.splice(i,1);state.activeGroup='all';state.menu=null;state.mapDirty=true;render();status('Group removed. Its nodes and hierarchy are unchanged.')}else if(a==='v2-comment-target'){v2OpenModal({type:'comment',target:t,context:v2Captured(t)})}else if(a==='v2-note-target'){v2AddNote(t)}else if(a==='v2-add-note'){v2AddNote(v2Target(el.dataset.kind,el.dataset.id))}else if(a==='v2-edit-note'||a==='v2-note-edit-target'){v2EditNote(a==='v2-edit-note'?el.dataset.id:t.id)}else if(a==='v2-remove-note'||a==='v2-note-remove-target'){v2RemoveNote(a==='v2-remove-note'?el.dataset.id:t.id)}else if(a==='v2-edit-target'){state.selected=t.id;state.panel='inspect';state.tab='details';state.editing=true;state.menu=null;render()}else if(a==='v2-pin-target'){state.selected='delivery';state.panel='inspect';state.tab='details';state.menu=null;render()}else if(a==='v2-undo-note'||a==='v2-undo-target'){if(state.undoNote){mapNotes.splice(state.undoNote.index,0,state.undoNote.note);state.undoNote=null;state.menu=null;syncNotes();render();status('Removed note restored.')}}else if(a==='v2-close-modal'){v2Close()}else if(a==='v2-remove-feedback'){state.feedbackQueue.splice(Number(el.dataset.index),1);render()}else if(a==='v2-handoff'){v2OpenModal({type:'handoff'})}else if(a==='v2-copy-request'){navigator.clipboard.writeText(v2RequestText()).then(()=>{document.getElementById('handoffStatus').textContent='Copied. Paste into the main chat to send it.'}).catch(()=>{document.getElementById('handoffStatus').textContent='Clipboard unavailable. Export the request instead.'})}else if(a==='v2-export-request'){v2Download(v2RequestText(),'repo-canvas-contextual-comments.md','text/markdown')}else if(a==='v2-export-target'){v2Download(JSON.stringify({prototype:true,nodes,mapNotes,groups},null,2),'repo-canvas-prototype-draft.json');state.menu=null;render()}else if(a==='v2-import-target'){v2OpenModal({type:'import'})}else if(a==='v2-reload-target'){state.menu=null;render();status('Reload would discard this prototype draft. Use the browser reload only when you want to reset it; review comments in the review page remain stored.')}},true);
document.addEventListener('change',e=>{if(e.target.id==='showLeaves'){e.stopImmediatePropagation();state.showLeaves=e.target.checked;render()}else if(e.target.id==='filterMode'){e.stopImmediatePropagation();state.filterMode=e.target.value;render()}},true);
document.addEventListener('submit',e=>{if(!e.target.id.startsWith('v2'))return;e.preventDefault();e.stopImmediatePropagation();const data=new FormData(e.target),m=state.modal;if(e.target.id==='v2CommentForm'){state.feedbackQueue.push({instruction:String(data.get('instruction')).trim(),context:m.context});state.modal=null;state.panel='chat';state.editing=false;render();status('Anchored instruction queued locally. Review the handoff before copying it to the main chat.')}else if(e.target.id==='v2NoteForm'){const patch={severity:String(data.get('severity')),text:String(data.get('text')).trim()};if(m.note){Object.assign(mapNotes.find(n=>n.id===m.note.id),patch)}else mapNotes.push({id:crypto.randomUUID(),targetKind:m.target.kind,targetId:m.target.id,...patch,author:'You',intent:'',source:''});state.selected=m.target.kind==='relationship'?'delivery':m.target.id;state.tab='notes';state.panel='inspect';state.modal=null;state.mapDirty=true;syncNotes();render()}else if(e.target.id==='v2ChildForm'){const id='draft-'+crypto.randomUUID();nodes.push({id,mapId:id,parent:m.parent,name:String(data.get('name')).trim(),purpose:String(data.get('purpose')).trim(),boundary:'',kind:'Module',sources:0,notes:0,children:0});state.modal=null;state.mapDirty=true;syncNotes();render();status('Child created in the demo draft. The parent is now visible in navigation.')}else if(e.target.id==='v2GroupForm'){const members=data.getAll('members');if(!members.length){e.target.querySelector('fieldset').insertAdjacentHTML('beforeend','<p class="inline-notice">Choose at least one node.</p>');return}const next={id:m.group?.id||'group-'+crypto.randomUUID(),scope:state.scope,name:String(data.get('name')).trim(),description:String(data.get('description')).trim(),presentation:String(data.get('presentation')),members};if(m.group)Object.assign(groups.find(g=>g.id===m.group.id),next);else groups.push(next);state.activeGroup=next.id;state.modal=null;state.mapDirty=true;render()}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.menu||state.modal)){e.preventDefault();e.stopImmediatePropagation();v2Close();return}if(e.key==='ContextMenu'||e.shiftKey&&e.key==='F10'){const target=e.target.closest('[data-context-kind]');if(target){e.preventDefault();e.stopImmediatePropagation();const r=target.getBoundingClientRect();v2OpenMenu(target.dataset.contextKind,target.dataset.contextId,r.left+20,r.top+20)}}if(state.menu&&['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();e.stopImmediatePropagation();const buttons=[...document.querySelectorAll('.object-context-menu button:not(:disabled)')];let i=buttons.indexOf(document.activeElement);i=e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;buttons[i]?.focus()}if(state.modal&&e.key==='Tab'){const list=[...document.querySelectorAll('.prototype-dialog button:not(:disabled),.prototype-dialog input,.prototype-dialog textarea,.prototype-dialog select,.prototype-dialog summary')];const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}},true);
document.addEventListener('pointerdown',e=>{if(state.menu&&!e.target.closest('.object-context-menu')){state.menu=null;document.querySelector('.object-context-menu')?.remove()}},true);
const oldShowPeek=showPeek;showPeek=function(id,kind){if(state.menu||state.modal)return;oldShowPeek(id,kind)};
const oldContract=contractPage;contractPage=function(){return oldContract()+`<article class="doc-page v2-contract"><div class="doc-grid"><section class="doc-card"><h3>Hierarchy and grouping are independent</h3><p>Nodes own their children. Groups reference existing siblings and may overlap. A lane is a presentation of a group, not a new node type or a second parent.</p><p>Filtering defaults to dim. Hide masks unrelated nodes in place and removes their edges; All restores them without reflow.</p></section><section class="doc-card"><h3>Persistent note or agent instruction?</h3><p><strong>Map note:</strong> risk, warning or info; saved with the architecture, editable and removable with Undo.</p><p><strong>Agent comment:</strong> an instruction plus a frozen target, scope, source references and base revision. It enters a request queue; it does not become a map note unless explicitly promoted.</p></section><section class="doc-card"><h3>Context menus need an accessible route</h3><p>Right-click is primary. Shift+F10, the context-menu key and small object menus expose the same actions. Touch does not depend on hover or a secondary mouse button.</p><p>Background menus contain map actions. Object menus contain only relevant actions. Escape dismisses without changing the draft.</p></section><section class="doc-card"><h3>Preset color is attention, not intent</h3><p>Risk uses red, warning yellow, info neutral white. Labels remain visible; color is never the only cue.</p><p>A decision or question is still a meaningful annotation intent. Changing its attention level preserves its text, author and accepted-decision context.</p></section></div></article>`};

render();
