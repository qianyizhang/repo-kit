<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Example MCP App</title>
    <style>
      /* STYLES */
    </style>
  </head>
  <body>
    <main id="workspace">
      <header class="appbar">
        <strong>Example MCP App</strong>
        <div class="row">
          <div class="mode" role="group" aria-label="Execution mode">
            <button id="fixture-mode" aria-pressed="true">Fixture</button
            ><button id="live-mode" aria-pressed="false">Live</button>
          </div>
          <button id="roles">Explain the 4 roles</button
          ><button id="connection" aria-label="App info">ⓘ Checking host</button>
        </div>
      </header>
      <div class="shell">
        <aside>
          <p class="eyebrow">Scenarios</p>
          <nav id="journeys" aria-label="Scenarios"></nav>
        </aside>
        <section class="content">
          <h1 id="journey-title"></h1>
          <p id="description" class="description"></p>
          <div id="variants" class="variants" role="group" aria-label="Outcome variants"></div>
          <div id="input-label" class="input-row">
            <label for="demo-text">Text</label
            ><input id="demo-text" maxlength="2000" value="Hello from the MCP App" /><span
              id="recorded-input"
              tabindex="0"
              class="input-note"
              >Recorded input ⓘ</span
            >
          </div>
          <p id="mode-note" class="small muted"></p>
          <div class="runbar">
            <button id="run" class="primary">Play fixture</button>
            <p id="availability"></p>
            <label id="history-label"
              >Runs
              <select id="history"></select
            ></label>
          </div>
          <div id="outcome" role="status"></div>
          <div class="row"><button id="check-conversation" hidden>Check conversation</button></div>
          <div
            id="phase-focus"
            class="phase-focus"
            role="group"
            aria-label="Highlight phase"
            hidden
          ></div>
          <div class="graph-head">
            <h2>Sequence</h2>
            <span id="order-note" class="small muted"></span>
          </div>
          <div class="graph-frame">
            <div id="actors" class="actors"></div>
            <div id="sequence" class="sequence"></div>
            <div class="graph-foot">
              <span>Hover or focus for payload · click / tap to pin</span
              ><span id="event-count"></span>
            </div>
          </div>
          <p class="legend">
            Solid: captured boundary (or labelled fixture). Dashed: destination not observed.
            Vertical spacing is not latency.
          </p>
          <div id="evidence-problem" class="gap" hidden>
            <p id="diagnostic-status"></p>
            <button id="refresh">Refresh evidence</button>
          </div>
          <div class="log-toolbar">
            <button id="log-toggle" aria-expanded="false">Event log</button
            ><button id="export">Export session log</button
            ><button id="capture" disabled>Save interaction capture</button
            ><span id="log-count" class="small muted"></span>
          </div>
          <p id="capture-status" class="small muted" role="status" hidden></p>
          <section id="event-log" hidden>
            <label
              >Show
              <select id="log-filter">
                <option value="interaction">Selected interaction</option>
                <option value="housekeeping">Housekeeping</option>
                <option value="session">Entire session</option>
              </select></label
            >
            <p id="log-help"></p>
            <div id="log-records"></div>
          </section>
        </section>
      </div>
    </main>
    <div id="payload-tip" role="tooltip" hidden></div>
    <dialog id="detail">
      <header>
        <h2 id="detail-title"></h2>
        <button id="detail-close" aria-label="Close details">Close</button>
      </header>
      <div id="detail-body"></div>
    </dialog>
    <script id="tool-catalog" type="application/json">
      /* CATALOG */
    </script>
    <script>
      /* SCRIPT */
    </script>
  </body>
</html>
